services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-local-only-change-me-to-a-long-random-secret}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-change-this-jwt-key-to-a-long-random-secret}
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI to your MongoDB Atlas SRV connection string in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      BKT_P0: ${BKT_P0:-0.30}
      BKT_T: ${BKT_T:-0.10}
      BKT_G: ${BKT_G:-0.20}
      BKT_S: ${BKT_S:-0.10}
      PROMOTE_M: ${PROMOTE_M:-0.85}
      PROMOTE_L: ${PROMOTE_L:-0.70}
      REGRESS_M: ${REGRESS_M:-0.40}
      STAGE_STREAK: ${STAGE_STREAK:-3}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy